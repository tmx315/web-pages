<!-- 修复：PC端不随意换行 + 手机端居中对齐 -->
<style>
    /* 外层容器：统一盒模型，解决宽度计算偏差 */
    .beian {
        display: block;
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        margin: 0 auto;
        /* 修复手机端偏左：添加左右内边距，且在所有屏幕生效 */
        padding: 0 12px; 
    }

    /* 备案号组：核心修复 */
    .beian-group {
        display: flex;
        align-items: center;
        /* 关键修复1：设置对齐方式，防止容器有剩余空间时错误换行 */
        align-content: flex-start;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-start;
        row-gap: 6px;
        width: 100%;
        /* 移除内部padding，避免和外层容器叠加导致宽度不足 */
        padding: 6px 0;
        box-sizing: border-box;
    }

    /* 强制元素固定尺寸，确保挤压判断绝对精准 */
    .beian-group a {
        flex-shrink: 0;
        flex-grow: 0;
        display: inline-block;
    }

    /* 雾备模块：与外层容器内边距对齐 */
    .github-badge {
        display: inline-flex;
        align-items: center;
        margin: 8px 0 0 0;
    }

    /* 图片统一尺寸 */
    .beian img {
        vertical-align: middle;
        height: 22px;
        width: auto;
    }

    /* 移动端适配：仅缩小间距和图片，不改变对齐逻辑 */
    @media (max-width: 768px) {
        .beian-group {
            gap: 6px;
            row-gap: 4px;
        }
        .beian img {
            height: 20px;
        }
    }

    @media (max-width: 375px) {
        .beian-group {
            gap: 4px;
        }
        .beian img {
            height: 18px;
        }
    }
</style>
